<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="72" viewBox="0 0 1200 72" aria-hidden="true">
  <defs>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667EEA" stop-opacity="0" />
      <stop offset="0.5" stop-color="#8D9BFF" />
      <stop offset="1" stop-color="#764BA2" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <line x1="80" y1="36" x2="1120" y2="36" stroke="url(#beam)" stroke-width="1.5" />
  <g transform="translate(600 36)" filter="url(#glow)">
    <circle r="10" fill="#0D1117" stroke="#667EEA" stroke-width="2" />
    <ellipse rx="25" ry="7" fill="none" stroke="#764BA2" stroke-width="2" transform="rotate(-12)" />
    <circle r="2.5" fill="#FFFFFF"><animate attributeName="opacity" values="0.35;1;0.35" dur="2s" repeatCount="indefinite" /></circle>
  </g>

  <g fill="#8D9BFF">
    <circle cx="170" cy="19" r="1.5"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.6s" repeatCount="indefinite" /></circle>
    <circle cx="1000" cy="52" r="1.5"><animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" /></circle>
  </g>

  <g filter="url(#glow)">
    <path d="M260 23l-42 13" stroke="#667EEA" stroke-width="2" stroke-linecap="round" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;720 14" dur="4s" repeatCount="indefinite" />
    </path>
    <circle cx="260" cy="23" r="2.5" fill="#FFFFFF" opacity="0">
      <animate attributeName="opacity" values="0;1;0" dur="4s" repeatCount="indefinite" />
      <animateTransform attributeName="transform" type="translate" values="0 0;720 14" dur="4s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
