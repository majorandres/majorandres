<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="150" viewBox="0 0 1200 150" role="img" aria-labelledby="title">
  <title id="title">Transmission complete — thanks for visiting</title>
  <defs>
    <linearGradient id="horizon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667EEA" stop-opacity="0" />
      <stop offset="0.5" stop-color="#8D9BFF" />
      <stop offset="1" stop-color="#764BA2" stop-opacity="0" />
    </linearGradient>
    <radialGradient id="planet">
      <stop offset="0" stop-color="#764BA2" stop-opacity="0.65" />
      <stop offset="1" stop-color="#060914" stop-opacity="0" />
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="150" rx="18" fill="#060914" />
  <ellipse cx="600" cy="185" rx="440" ry="115" fill="url(#planet)" />
  <path d="M80 115 Q600 16 1120 115" fill="none" stroke="url(#horizon)" stroke-width="2" filter="url(#glow)" />

  <g fill="#FFFFFF">
    <circle cx="110" cy="35" r="1.3"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.5s" repeatCount="indefinite" /></circle>
    <circle cx="276" cy="72" r="1"><animate attributeName="opacity" values="1;0.25;1" dur="3.2s" repeatCount="indefinite" /></circle>
    <circle cx="922" cy="63" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.8s" repeatCount="indefinite" /></circle>
    <circle cx="1084" cy="28" r="1"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite" /></circle>
  </g>

  <g font-family="Segoe UI, Ubuntu, sans-serif" text-anchor="middle">
    <text x="600" y="68" fill="#8D9BFF" font-size="14" letter-spacing="5">TRANSMISSION COMPLETE</text>
    <text x="600" y="94" fill="#DCE2FF" font-size="12" letter-spacing="3">THANKS FOR VISITING // SIGNAL LOCKED</text>
  </g>
</svg>
