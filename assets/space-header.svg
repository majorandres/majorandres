<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Andres Popoca</title>
  <desc id="desc">An animated space-themed header for Andres Popoca's profile.</desc>
  <defs>
    <radialGradient id="nebulaBlue">
      <stop offset="0" stop-color="#667EEA" stop-opacity="0.42" />
      <stop offset="1" stop-color="#667EEA" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="nebulaPurple">
      <stop offset="0" stop-color="#764BA2" stop-opacity="0.4" />
      <stop offset="1" stop-color="#764BA2" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667EEA" stop-opacity="0" />
      <stop offset="0.5" stop-color="#8D9BFF" />
      <stop offset="1" stop-color="#764BA2" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" />
      <stop offset="0.5" stop-color="#AAB4FF" />
      <stop offset="1" stop-color="#FFFFFF" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="260" rx="18" fill="#060914" />
  <ellipse cx="190" cy="90" rx="310" ry="220" fill="url(#nebulaBlue)">
    <animate attributeName="opacity" values="0.55;0.9;0.55" dur="7s" repeatCount="indefinite" />
  </ellipse>
  <ellipse cx="1030" cy="170" rx="340" ry="230" fill="url(#nebulaPurple)">
    <animate attributeName="opacity" values="0.9;0.5;0.9" dur="8s" repeatCount="indefinite" />
  </ellipse>

  <g fill="#FFFFFF">
    <circle cx="58" cy="46" r="1.7"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="139" cy="187" r="1.2"><animate attributeName="opacity" values="1;0.25;1" dur="3.1s" repeatCount="indefinite" /></circle>
    <circle cx="248" cy="42" r="1"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.7s" repeatCount="indefinite" /></circle>
    <circle cx="356" cy="213" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="3.4s" repeatCount="indefinite" /></circle>
    <circle cx="474" cy="30" r="1.2"><animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" /></circle>
    <circle cx="722" cy="39" r="1.5"><animate attributeName="opacity" values="1;0.25;1" dur="2.9s" repeatCount="indefinite" /></circle>
    <circle cx="843" cy="218" r="1.1"><animate attributeName="opacity" values="0.3;1;0.3" dur="3.3s" repeatCount="indefinite" /></circle>
    <circle cx="966" cy="48" r="1.8"><animate attributeName="opacity" values="1;0.2;1" dur="2.5s" repeatCount="indefinite" /></circle>
    <circle cx="1118" cy="198" r="1.4"><animate attributeName="opacity" values="0.25;1;0.25" dur="3s" repeatCount="indefinite" /></circle>
    <circle cx="1160" cy="71" r="1"><animate attributeName="opacity" values="1;0.3;1" dur="2.3s" repeatCount="indefinite" /></circle>
  </g>

  <g fill="none" stroke="url(#orbit)" filter="url(#glow)">
    <ellipse cx="600" cy="129" rx="438" ry="82" stroke-width="1.3" stroke-dasharray="10 12">
      <animate attributeName="stroke-dashoffset" values="0;-44" dur="5s" repeatCount="indefinite" />
    </ellipse>
    <ellipse cx="600" cy="129" rx="330" ry="112" stroke-width="0.8" opacity="0.65" transform="rotate(-7 600 129)" />
  </g>

  <circle r="5" fill="#FFFFFF" filter="url(#glow)">
    <animateMotion dur="8s" repeatCount="indefinite" path="M162 129a438 82 0 1 0 876 0a438 82 0 1 0-876 0" />
  </circle>

  <g font-family="Segoe UI, Ubuntu, sans-serif" text-anchor="middle">
    <text x="600" y="120" fill="url(#name)" font-size="58" font-weight="700" letter-spacing="9" filter="url(#glow)">ANDRES POPOCA</text>
    <text x="600" y="161" fill="#8D9BFF" font-size="16" letter-spacing="5">SOFTWARE ENGINEERING • AI/ML • CLOUD</text>
    <text x="600" y="207" fill="#AAB4C8" font-size="12" letter-spacing="4">UIC // CHICAGO // MAY 2027</text>
  </g>
</svg>
