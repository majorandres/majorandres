<svg xmlns="http://www.w3.org/2000/svg" width="800" height="250" viewBox="0 0 800 250" role="img" aria-labelledby="title desc">
  <title id="title">Andres Popoca's GitHub streak statistics</title>
  <desc id="desc">728 total contributions, a current streak of 2 days, and a longest streak of 8 days.</desc>

  <defs>
    <linearGradient id="frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#667EEA" />
      <stop offset="1" stop-color="#764BA2" />
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#667EEA" />
      <stop offset="1" stop-color="#764BA2" />
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2" width="796" height="246" rx="14" fill="#0D1117" stroke="url(#frame)" stroke-width="4" />
  <rect x="14" y="14" width="772" height="222" rx="10" fill="#0D1117" />

  <g stroke="#667EEA" stroke-width="1.5" opacity="0.45">
    <line x1="268" y1="42" x2="268" y2="208" />
    <line x1="532" y1="42" x2="532" y2="208" />
  </g>

  <g font-family="Segoe UI, Ubuntu, sans-serif" text-anchor="middle">
    <g fill="#667EEA" font-weight="700">
      <text x="140" y="104" font-size="38">728</text>
      <text x="400" y="112" font-size="38">2</text>
      <text x="660" y="104" font-size="38">8</text>
    </g>

    <g fill="#8D9BFF" font-size="18">
      <text x="140" y="151">Total Contributions</text>
      <text x="400" y="178" font-weight="700">Current Streak</text>
      <text x="660" y="151">Longest Streak</text>
    </g>

    <g fill="#F1F5F9" font-size="14">
      <text x="140" y="193">Nov 7, 2023 - Present</text>
      <text x="400" y="214">Aug 13 - Aug 14</text>
      <text x="660" y="193">Nov 18, 2025 - Nov 25, 2025</text>
    </g>
  </g>

  <circle cx="400" cy="92" r="58" fill="none" stroke="#18232E" stroke-width="9" />
  <circle cx="400" cy="92" r="58" fill="none" stroke="url(#accent)" stroke-width="9" stroke-linecap="round" stroke-dasharray="365" filter="url(#glow)" transform="rotate(-90 400 92)">
    <animate attributeName="stroke-dashoffset" values="365;0" dur="1.4s" fill="freeze" />
  </circle>

  <path d="M400 27c-11 14-5 22-12 29-8 8-5 23 12 23s21-15 12-24c-5-5-5-11-2-18-7 6-10 2-10-10zm1 21c6 7 6 13-1 18-7-3-8-10 1-18z" fill="#764BA2" filter="url(#glow)">
    <animate attributeName="opacity" values="0.7;1;0.7" dur="1.5s" repeatCount="indefinite" />
  </path>

  <g fill="#667EEA">
    <circle cx="32" cy="28" r="3"><animate attributeName="opacity" values="0.25;1;0.25" dur="2.2s" repeatCount="indefinite" /></circle>
    <circle cx="768" cy="222" r="3"><animate attributeName="opacity" values="1;0.25;1" dur="2.2s" repeatCount="indefinite" /></circle>
  </g>
</svg>
